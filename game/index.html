<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Port Azahar 3D</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="wrap">
<canvas id="gl"></canvas>
<div id="hud">
  <div id="banner"></div>
  <div id="topbar"><span id="cash">$0</span><span id="respect">RESPECT 0</span><span id="wanted">☆☆☆☆☆</span><span id="clock">18:42</span></div>
  <div id="district"></div>
  <div id="objective"></div>
  <div id="speed">0 km/h</div>
  <div id="healthbar"><div id="healthfill"></div></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="prompt"></div>
  <div id="countdown"></div>
  <div id="racehud"></div>
</div>
<div id="menu">
  <h1>PORT AZAHAR</h1><p class="sub">A dusk port-city crime story · Nadia Ferrer, fixer</p>
  <button id="btn-new">▶ &nbsp;NEW GAME</button>
  <button id="btn-continue">↻ &nbsp;CONTINUE</button>
  <button id="btn-garage">▣ &nbsp;GARAGE</button>
  <div class="controls">WASD drive / walk &nbsp;·&nbsp; Mouse look &nbsp;·&nbsp; E enter car &nbsp;·&nbsp; F shoot &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; Space handbrake &nbsp;·&nbsp; M missions</div>
  <div class="controls small">Policía Portuaria (PPA) · Wanted ★1–5 · 8 story jobs · Quay race · Saves locally</div>
</div>
<div id="toast"></div>
</div>
<script src="vendor/three.min.js"></script>
<script type="module" src="src/main.js"></script>
</body></html>
